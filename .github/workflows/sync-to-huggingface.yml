name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: Janhavi30052002/csds553-case-study-1-4
          huggingface_repo_id: JanuB/chatbot
          hf_token: ${{ secrets.HF_TOKEN }}